version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nercare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ner_cognitivecare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nercare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nercare-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/ner_cognitivecare
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-key-ner-care-2026-prod-secure-32chars
      ENVIRONMENT: production
      AI_PROVIDER: rule_based
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:8080","*"]'
    ports:
      - "8000:8000"

volumes:
  pgdata:
